spring:
  datasource:
    url: jdbc:h2:mem:uvya-auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      url: redis://localhost:6379

management:
  health:
    redis:
      enabled: false

uvya:
  auth:
    refresh-token-pepper: test-refresh-token-pepper-with-at-least-32-chars
    jwt:
      issuer: http://test.local
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    refresh-cookie:
      name: uvya_refresh
      secure: false
      same-site: Strict
    password:
      bcrypt-strength: 4
    rate-limit:
      login-ip-limit: 100
      login-identity-limit: 100
      window: PT15M
      max-failed-attempts: 5
      lock-duration: PT15M
    cors:
      allowed-origins:
        - http://localhost:3000
