spring:
  application:
    name: api-gateway
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/uvya}
    username: ${SPRING_DATASOURCE_USERNAME:uvya}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local-postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://:change-me-local-redis@localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false
    admin:
      auto-create: true

debug: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: Uvya API Gateway
    description: HTTP edge process with authentication foundation

uvya:
  events:
    kafka:
      enabled: ${UVYA_KAFKA_ENABLED:true}
      health:
        enabled: ${UVYA_KAFKA_HEALTH_ENABLED:true}
      send-timeout: ${UVYA_KAFKA_SEND_TIMEOUT:PT10S}
    outbox:
      enabled: ${UVYA_OUTBOX_ENABLED:true}
      poll-interval-ms: ${UVYA_OUTBOX_POLL_INTERVAL_MS:1000}
    consumer:
      group-id: ${UVYA_KAFKA_CONSUMER_GROUP_ID:uvya-events}
      concurrency: ${UVYA_KAFKA_CONSUMER_CONCURRENCY:3}
    retry:
      immediate-attempts: ${UVYA_EVENT_IMMEDIATE_ATTEMPTS:1}
      delayed-attempts: ${UVYA_EVENT_DELAYED_ATTEMPTS:3}
      delayed-base-delay-ms: ${UVYA_EVENT_DELAYED_BASE_DELAY_MS:1000}
      delayed-max-delay-ms: ${UVYA_EVENT_DELAYED_MAX_DELAY_MS:60000}
      jitter-ratio: ${UVYA_EVENT_RETRY_JITTER_RATIO:0.2}
    topics:
      partitions: ${UVYA_KAFKA_TOPIC_PARTITIONS:6}
      replication-factor: ${UVYA_KAFKA_TOPIC_REPLICATION_FACTOR:1}
  auth:
    refresh-token-pepper: ${UVYA_REFRESH_TOKEN_PEPPER:}
    jwt:
      issuer: ${UVYA_JWT_ISSUER:http://localhost:8080}
      access-token-ttl: ${UVYA_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${UVYA_REFRESH_TOKEN_TTL:P30D}
      private-key-base64: ${UVYA_JWT_PRIVATE_KEY_BASE64:}
      public-key-base64: ${UVYA_JWT_PUBLIC_KEY_BASE64:}
    refresh-cookie:
      name: ${UVYA_REFRESH_COOKIE_NAME:uvya_refresh}
      secure: ${UVYA_REFRESH_COOKIE_SECURE:false}
      same-site: ${UVYA_REFRESH_COOKIE_SAME_SITE:Strict}
    password:
      bcrypt-strength: ${UVYA_BCRYPT_STRENGTH:12}
    rate-limit:
      login-ip-limit: ${UVYA_LOGIN_IP_LIMIT:30}
      login-identity-limit: ${UVYA_LOGIN_IDENTITY_LIMIT:10}
      window: ${UVYA_LOGIN_RATE_WINDOW:PT15M}
      max-failed-attempts: ${UVYA_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${UVYA_ACCOUNT_LOCK_DURATION:PT15M}
    cors:
      allowed-origins: ${UVYA_CORS_ALLOWED_ORIGINS:http://localhost:3000}
