name: ${COMPOSE_PROJECT_NAME:-uvya}

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uvya

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Copy .env.example to .env first}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uvya

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - uvya

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uvya

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-uvya:ws}
      UVYA_FANOUT_ENABLED: ${UVYA_FANOUT_ENABLED:-true}
      UVYA_JWT_ISSUER: ${UVYA_JWT_ISSUER:-http://localhost:8080}
      UVYA_JWT_PRIVATE_KEY_BASE64: ${UVYA_JWT_PRIVATE_KEY_BASE64:-}
      UVYA_JWT_PUBLIC_KEY_BASE64: ${UVYA_JWT_PUBLIC_KEY_BASE64:-}
      UVYA_REFRESH_TOKEN_PEPPER: ${UVYA_REFRESH_TOKEN_PEPPER:?Copy .env.example to .env first}
      UVYA_REFRESH_COOKIE_SECURE: ${UVYA_REFRESH_COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - uvya

  ws-gateway:
    build:
      context: ./services/ws-gateway
    environment:
      PORT: 8081
      LOG_LEVEL: info
      API_BASE_URL: http://api-gateway:8080
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-uvya:ws}
      PRESENCE_TTL: ${PRESENCE_TTL:-2m}
      TYPING_TTL: ${TYPING_TTL:-8s}
      PRESENCE_SUBSCRIPTION_TTL: ${PRESENCE_SUBSCRIPTION_TTL:-15m}
      PRESENCE_DEBOUNCE: ${PRESENCE_DEBOUNCE:-500ms}
      JWT_JWKS_URL: http://api-gateway:8080/.well-known/jwks.json
      UVYA_JWT_ISSUER: ${UVYA_JWT_ISSUER:-http://localhost:8080}
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "${WS_PORT:-8081}:8081"
    depends_on:
      api-gateway:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - uvya

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:${WS_PORT:-8081}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:${WS_PORT:-8081}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api-gateway
      - ws-gateway
    networks:
      - uvya

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:

networks:
  uvya:
    driver: bridge
